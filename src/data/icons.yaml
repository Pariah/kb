# Ability name -> Wowhead icon name. Files live in public/icons/<name>.jpg.
# `bun run icons` looks up any ability missing here on Wowhead (Classic first,
# then Retail for spells Classic doesn't have), adds it, and downloads the file.
# A binding's own `icon` overrides this map (warlock Mount).

