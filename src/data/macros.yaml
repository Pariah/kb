"Pot: Bandage":
  tab: general
  note: Recently Bandaged blocks the second use, so only the best one you own fires. Self-casts when your target is hostile.
  body: |-
    #showtooltip
    /use Heavy Runecloth Bandage
    /use Runecloth Bandage
    /use Heavy Mageweave Bandage
    /use Mageweave Bandage
    /use Heavy Silk Bandage
    /use Silk Bandage
    /use Heavy Wool Bandage
    /use Wool Bandage
    /use Heavy Linen Bandage
    /use Linen Bandage
