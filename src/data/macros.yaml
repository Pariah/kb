# Macro library. Keys are the in-game macro names (Prefix: Name, max 16 chars).
# tab: general or a class slug. body: the macro text, max 255 chars.
# note: context for editing; never rendered on the site.

"Atk: Melee":
  tab: general
  note: Grabs the nearest enemy if you have nothing hostile targeted.
  body: |-
    #showtooltip Attack
    /targetenemy [noharm][dead]
    /startattack [harm,nodead]
