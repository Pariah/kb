"Util: Charge":
  tab: warrior
  note: "Out of combat with a shield and Vanguard: Charge from Defensive. Out of combat otherwise: Battle Stance, then Charge. In combat without a shield: Berserker Stance, then Intercept. With a shield it does nothing in combat (stays in Defensive)."
  body: |-
    #showtooltip
    /startattack [harm,nodead]
    /use [nocombat,worn:Shields,known:Vanguard,form:2]Charge;[nocombat,noform:1]Battle Stance;[nocombat]Charge;[noworn:Shields,noform:3]Berserker Stance;[noworn:Shields]Intercept
"Util: Interrupt":
  tab: warrior
  note: "Shield on: Shield Bash (leaves Berserker first if needed). No shield, no Pummel yet: equips SNB, then Shield Bash. No shield, Pummel known: Berserker Stance, then Pummel."
  body: |-
    #showtooltip
    /startattack [harm,nodead]
    /equipset [noworn:Shields,noknown:Pummel]SNB
    /use [form:3,known:Pummel]Pummel;[form:3]Battle Stance;[worn:Shields]Shield Bash;[known:Pummel]Berserker Stance
