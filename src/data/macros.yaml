"Sys: Audio":
  tab: general
  note: Cycles the sound output device and prints its name.
  body: /run local c="Sound_OutputDriverIndex" local v=(tonumber(GetCVar(c))+1)%Sound_GameSystem_GetNumOutputDrivers() SetCVar(c,v) print("Audio:",Sound_GameSystem_GetOutputDriverNameByIndex(v)) Sound_GameSystem_RestartSoundSystem()
"Sys: Clear Bars":
  tab: general
  note: Wipes every action slot, this macro included. For fresh characters.
  body: /run for i=1,180 do PickupAction(i) ClearCursor() end
"Sys: Spec Swap":
  tab: general
  note: Dual spec, level 40. Assign each equipment set to its spec in the equipment manager to swap gear with it.
  body: /run local s=C_SpecializationInfo s.SetActiveSpecGroup(3-s.GetActiveSpecGroup())
"Sys: Sync Off":
  tab: general
  body: /run for _,c in ipairs({"synchronizeBindings","synchronizeChatFrames","synchronizeConfig"}) do SetCVar(c,0) end print("Sync off")
"Sys: Sync On":
  tab: general
  note: "`synchronizeMacros` and `synchronizeSettings` don't exist on this client."
  body: /run for _,c in ipairs({"synchronizeBindings","synchronizeChatFrames","synchronizeConfig"}) do SetCVar(c,1) end print("Sync on")
